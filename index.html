<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ShelterSync Platform Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: ink sidebar + paper canvas; white cards with 1px line borders, no shadows; amber reserved for one primary action, focus, active nav.
   Light only by design (brief §10: no dark mode). Tokens copied 1:1 from brief §3 + the ShelterSync demo sidebar tokens. */
:root{
  color-scheme:light;
  --paper:#F3F2F7;--card:#FFFFFF;--ink:#231F45;--muted:#4E4A6B;--muted2:#6E6A88;
  --acc:#F2B930;--accD:#8A5A00;--accTint:#FBF0D0;--accTint2:#FDF6E3;
  --ok:#1E7A6E;--okD:#155C53;--okT:#D5EFEA;
  --away:#D9822B;--awayD:#8F4E0E;--awayT:#FBE9D6;
  --err:#A3261C;--errT:#FBE4E1;
  --line:#DAD8E4;--line2:#C8C5D6;--lineS:#E7E5EF;--tHead:#EEEDF4;--selT:#ECEAF7;--track:#E4E2EC;--inpB:#8E8AA8;
  --onDark:#FFFFFF;
  /* sidebar derivatives taken from the customer demo */
  --sideM:#CBC8E0;--sideH:#A9A5C6;--sideSel:#3A3563;--sideIn:#2D2856;--hover:#F6F5FA;
  --scrim:rgba(23,20,47,.45);
  --f-display:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r-ctl:8px;--r-btn:10px;--r-card:12px;
  --ring:0 0 0 2px var(--card),0 0 0 4px var(--acc),0 0 0 5.5px var(--ink);
  --pad:28px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ink)}
:focus{outline:none}
:focus-visible{box-shadow:var(--ring);border-radius:6px}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:0}
.num,.tbl td,.kpi .v{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.muted2{color:var(--muted2)}
.eyebrow{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted2)}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.01em;margin:0;text-wrap:balance;color:var(--ink)}
h1{font-size:26px;font-weight:800;line-height:1.15}
h2{font-size:18px;font-weight:700;line-height:1.25}
h3{font-size:15px;font-weight:700}
.sr{position:absolute;left:0;top:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.s{width:14px;height:14px}.ico.xs{width:12px;height:12px;stroke-width:2.2}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.side{background:var(--ink);color:var(--onDark);padding:16px 12px 20px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 10px 14px}
.brand .mk{width:30px;height:30px;border-radius:8px;background:var(--onDark);display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:6px}
.brand .mk i{background:var(--ink);border-radius:2px}.brand .mk i:nth-child(2){background:var(--acc)}
.brand b{font-family:var(--f-display);font-size:18px;font-weight:800;display:block;line-height:1.1;white-space:nowrap}
.adm{display:inline-block;vertical-align:3px;margin-left:4px;background:var(--acc);color:var(--ink);font:800 10.5px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;border-radius:5px;padding:4px 6px}
.brand small{color:var(--sideM);font-size:12.5px}
.side .h{font-size:12.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--sideH);padding:14px 10px 4px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--sideM);text-decoration:none;font-weight:500;font-size:14.5px;position:relative;border:0;background:none;width:100%;text-align:left;cursor:pointer}
.nav:hover{background:var(--sideIn);color:var(--onDark)}
.nav.on{background:var(--sideSel);color:var(--onDark);font-weight:600}
.nav.on .ico{color:var(--acc)}
.nav.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--acc)}
.nav .cnt{margin-left:auto;background:var(--acc);color:var(--ink);font-size:11.5px;font-weight:700;border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 6px}
.side .proto{margin-top:auto;border-top:1px solid var(--sideSel);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.side .proto label{font-size:12.5px;color:var(--sideM);padding:0 10px}
.sseg{display:flex;background:var(--sideIn);border-radius:10px;padding:3px;margin:0 10px}
.sseg button{flex:1;border:0;background:none;color:var(--sideM);border-radius:8px;padding:5px 6px;font-size:12.5px;font-weight:600;cursor:pointer}
.side .sw .tr{background:var(--sideIn);border-color:var(--sideH)}
.side .sw input:checked+.tr{background:var(--acc);border-color:var(--acc)}
.side .sw input:checked+.tr::after{border-color:var(--ink)}
.sseg button.on{background:var(--onDark);color:var(--ink)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:12px var(--pad);min-height:64px}
.top h1{font-size:24px;flex:none;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .sp{flex:1}
.iconbtn.burger{display:none}
.gsearch{position:relative;width:min(360px,34vw)}
.gsearch .inp{padding-left:34px;padding-right:34px}
.gsearch>.ico{position:absolute;left:11px;top:10px;color:var(--muted2)}
.kbd{position:absolute;right:8px;top:8px;border:1px solid var(--line2);border-radius:5px;font:500 11px/1 var(--f-mono);padding:4px 5px;color:var(--muted)}
.gres{position:absolute;top:44px;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:6px;z-index:30;box-shadow:0 20px 48px -12px rgba(35,31,69,.22)}
.gres a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;text-decoration:none}
.gres a:hover,.gres a.hi{background:var(--selT)}
.gres .eyebrow{padding:6px 10px 2px}
.envb{display:inline-flex;align-items:center;gap:6px;background:var(--acc);color:var(--ink);font-weight:800;font-size:12px;letter-spacing:.08em;border-radius:999px;padding:4px 10px}
.envb.prod{background:var(--okT);color:var(--okD);letter-spacing:.04em}
.umenu{position:relative}
.ubtn{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:4px 6px;border-radius:10px;text-align:right}
.ubtn:hover{background:var(--hover)}
.ubtn b{display:block;font-size:14px;line-height:1.2}.ubtn small{color:var(--muted2);font-size:12.5px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--selT);display:grid;place-items:center;font-weight:700;font-size:12.5px;color:var(--ink);flex:none}
.page{padding:var(--pad);display:flex;flex-direction:column;gap:16px;max-width:1480px;width:100%}
.phead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.phead .lead{flex:1 1 380px;min-width:0;color:var(--muted);max-width:68ch}
.phead .acts{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.crumb{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px;flex-wrap:wrap}
.crumb a{color:var(--muted);text-decoration:none}.crumb a:hover{color:var(--ink);text-decoration:underline}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:var(--onDark);border-radius:999px;padding:3px 11px 3px 9px;font-weight:600;font-size:13px}
.chip .ico{color:var(--acc)}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 15px;border-radius:var(--r-btn);font-weight:600;font-size:14px;cursor:pointer;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--hover)}
.btn.sm{height:32px;padding:0 11px;font-size:13px;border-radius:9px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--ink)}
.btn.pri:hover{background:#E9AE22}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--onDark)}
.btn.dark:hover{background:#2F2A5A}
.btn.quiet{border-color:var(--line2);border-width:1px}
.btn.danger{border-color:var(--err);color:var(--err);border-width:1.5px}
.btn.danger:hover{background:var(--errT)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--hover)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn.busy{pointer-events:none;opacity:.75}
.btn.busy::after{content:"";width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.iconbtn{width:32px;height:32px;padding:0;border-radius:8px;border:1px solid var(--line2);background:var(--card);display:inline-grid;place-items:center;cursor:pointer;color:var(--ink)}
.iconbtn:hover{background:var(--hover)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-size:12.5px;font-weight:600;color:var(--ink)}
.field .help{font-size:12.5px;color:var(--muted2)}
.field .errm{font-size:12.5px;color:var(--err);font-weight:600;display:flex;gap:5px;align-items:center}
.inp{height:38px;width:100%;border:1px solid var(--inpB);border-radius:var(--r-ctl);background:var(--card);padding:0 11px;min-width:0}
textarea.inp{height:auto;padding:9px 11px;min-height:76px;resize:vertical}
.inp:focus-visible{box-shadow:none;border-color:var(--ink);outline:2px solid var(--acc);outline-offset:1px}
.inp.bad{border-color:var(--err);background:#FFF9F8}
.inp[readonly]{background:var(--paper);color:var(--muted)}
.sel{position:relative}
.sel select{appearance:none;-webkit-appearance:none;padding-right:34px;cursor:pointer}
.sel>.ico{position:absolute;right:10px;top:10px;pointer-events:none;color:var(--muted)}
.date{position:relative}.date .inp{padding-right:34px}.date>.ico{position:absolute;right:10px;top:10px;color:var(--muted);pointer-events:none}
.secret{display:flex;align-items:center;gap:10px;height:38px;border:1px dashed var(--line2);border-radius:var(--r-ctl);padding:0 6px 0 11px;background:var(--paper)}
.secret span{flex:1;color:var(--muted);font-family:var(--f-mono);font-size:12px}
.sw{display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw .tr{width:38px;height:22px;border-radius:999px;background:var(--track);border:1px solid var(--line2);position:relative;transition:.15s;flex:none}
.sw .tr::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--card);border:1px solid var(--line2);transition:.15s}
.sw input:checked+.tr{background:var(--ink);border-color:var(--ink)}
.sw input:checked+.tr::after{left:18px;border-color:var(--ink)}
.sw input:focus-visible+.tr{box-shadow:var(--ring)}
.sw input:disabled+.tr{opacity:.5}
.chk{width:17px;height:17px;accent-color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 16px}
.span2{grid-column:span 2}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}

/* ---------- segmented + tabs ---------- */
.seg{display:inline-flex;background:var(--tHead);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:9px;padding:5px 12px;font-weight:600;color:var(--muted);cursor:pointer;display:inline-flex;gap:7px;align-items:center;font-size:14px}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(35,31,69,.05),0 6px 16px -6px rgba(35,31,69,.12)}
.seg .n{font-size:12px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.seg button.on .n{background:var(--ink);color:var(--onDark);border-radius:999px;padding:0 6px;min-width:18px;text-align:center}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;border-radius:6px 6px 0 0}
.tabs button:hover{color:var(--ink);background:var(--hover)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}

/* ---------- cards, kpis ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);min-width:0}
.card.pad{padding:18px}
.card .ch{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--lineS);flex-wrap:wrap}
.card .ch h2{font-size:16px}
.card .ch .sub{color:var(--muted2);font-size:13px}
.card .ch .r{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card .cb{padding:16px 18px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--lineS)}
.toolbar .r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;position:relative}
a.kpi:hover{border-color:var(--line2);background:var(--hover)}
.kpi .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpi .v{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.05;letter-spacing:-.01em}
.kpi .v small{font-family:var(--f-body);font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:4px}
.kpi .s{color:var(--muted);font-size:13px}
.kpi .go{position:absolute;right:14px;bottom:12px;color:var(--muted2)}
.split{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:16px;align-items:start}
.split.r{grid-template-columns:minmax(0,1fr) 340px}
.dl{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:9px 16px;margin:0}
.dl dt{color:var(--muted2);font-size:13px;font-weight:600}
.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px 2px 7px;font-weight:600;font-size:12.5px;white-space:nowrap;line-height:1.6}
.pill.ok{background:var(--okT);color:var(--okD)}
.pill.neu{background:var(--tHead);color:var(--muted)}
.pill.att{background:var(--accTint);color:var(--accD)}
.pill.warn{background:var(--awayT);color:var(--awayD)}
.pill.err{background:var(--errT);color:var(--err)}
.pill.ink{background:var(--ink);color:var(--onDark)}
.tag{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:6px;padding:0 6px;font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.tag.test{background:var(--accTint);border-color:var(--acc);color:var(--accD)}
.tag.prod{background:var(--ink);border-color:var(--ink);color:var(--onDark)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--away)}.dot.err{background:var(--err)}.dot.neu{background:var(--line2)}
.health{display:inline-flex;align-items:center;gap:7px;font-weight:500}

/* ---------- tables ---------- */
.tw{overflow-x:auto;position:relative}
.card,.tabs{position:relative}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{background:var(--tHead);text-align:left;font-size:12.5px;font-weight:600;color:var(--muted);padding:9px 14px;white-space:nowrap;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--lineS);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover td{background:var(--hover)}
.tbl .r,.tbl th.r{text-align:right}
.tbl .c{text-align:center}
.tbl td.nm a{font-weight:600;text-decoration:none}
.tbl td.nm a:hover{text-decoration:underline}
.tbl tr.exp td{background:var(--paper)}
.tbl tfoot td{font-weight:700;border-top:1px solid var(--line);background:var(--accTint2)}
.pager{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--lineS);color:var(--muted);font-size:13px;flex-wrap:wrap}
.pager .r{margin-left:auto;display:flex;gap:6px}
.sk{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,var(--tHead),var(--lineS),var(--tHead));background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{padding:44px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted)}
.empty .ei{width:44px;height:44px;border-radius:12px;background:var(--tHead);display:grid;place-items:center;color:var(--muted)}
.empty b{color:var(--ink);font-size:15px}
.errstate{padding:28px 20px;display:flex;gap:12px;align-items:center;justify-content:center;color:var(--err);font-weight:600;flex-wrap:wrap}

/* ---------- attention list ---------- */
.att{list-style:none;margin:0;padding:0}
.att li a{display:flex;gap:12px;align-items:flex-start;padding:12px 18px;border-bottom:1px solid var(--lineS);text-decoration:none}
.att li:last-child a{border-bottom:0}
.att li a:hover{background:var(--hover)}
.att .sv{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none}
.att .sv.err{background:var(--errT);color:var(--err)}.att .sv.warn{background:var(--awayT);color:var(--awayD)}.att .sv.att{background:var(--accTint);color:var(--accD)}
.att b{font-weight:600;display:block}
.att small{color:var(--muted);font-size:13px}
.att .go{margin-left:auto;color:var(--muted2);align-self:center}

/* ---------- small multiples ---------- */
.sm-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding:16px 18px}
.smc{border:1px solid var(--lineS);border-radius:10px;padding:10px 12px}
.smc .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.smc .hd b{font-size:13.5px}
.smc .hd>span.num{font-family:var(--f-display);font-weight:800;font-size:18px}
.smc svg{width:100%;height:auto;display:block;overflow:visible}
.smc .ax{fill:var(--muted2);font-size:11px;font-family:var(--f-body)}

/* ---------- health strip ---------- */
.strip{display:grid;grid-template-columns:repeat(30,1fr);gap:2px}
.strip i{height:22px;border-radius:3px;display:block}
.strip i.ok{background:var(--ok)}.strip i.warn{background:var(--away)}.strip i.err{background:var(--err)}.strip i.none{background:var(--track)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;gap:6px;align-items:center}

/* ---------- banners, notes ---------- */
.banner{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:var(--r-card);border:1px solid}
.banner.warn{background:var(--awayT);border-color:#EFC9A2;color:var(--awayD)}
.banner.err{background:var(--errT);border-color:#F0B9B2;color:var(--err)}
.banner.info{background:var(--accTint2);border-color:#F1DDA5;color:var(--ink)}

const custName = id => (CUSTOMERS.find(c => c.id === id) || {}).name || '—';
const cust = id => CUSTOMERS.find(c => c.id === id);
const invById = id => INVOICES.find(i => i.id === id);

/* ================= derived ================= */
function attentionItems() {
  const items = [];
  INVOICES.filter(i => i.status === 'overdue').forEach(i => items.push({ sev: 'err', icon: 'euro', label: `Invoice ${i.number} is overdue`, sub: `${custName(i.cid)} · ${fmtMoney(i.open)} open · due ${fmtDate(i.due)} (${diffDays(i.due, TODAY)} days ago)`, link: `invoice.${i.id}` }));
  DEPLOYMENTS.filter(d => d.status === 'down').forEach(d => items.push({ sev: 'err', icon: 'pulse', label: `${custName(d.cid)} ${d.env.toUpperCase()} is down`, sub: `Failing checks since ${fmtDT(d.downSince)} (${Math.round((new Date(NOW) - new Date(d.downSince)) / 36e5)} h) · last HTTP ${d.last.http}`, link: `customer.${d.cid}.deployments` }));
  items.push({ sev: 'err', icon: 'db', label: 'Usage collection failing for Stichting Demo B (PROD)', sub: '2 failed runs · last error HTTP_502_UPSTREAM · 05-10-2026 not collected', link: 'usage' });
  INVOICES.filter(i => i.drift).forEach(i => items.push({ sev: 'warn', icon: 'alert', label: `Usage changed after ${i.number} was issued`, sub: `${custName(i.cid)} · ${fmtMonth(i.ym)} · Locatie Molenhoek +30 resident-days`, link: `invoice.${i.id}` }));
  IRUNS.filter(r => r.st === 'failed').forEach(r => { const s = SOURCES.find(x => x.id === r.sid); items.push({ sev: 'err', icon: 'plug', label: `Integration run failed: ${s.name}`, sub: `${custName(s.cid)} · ${r.err} · ${fmtDT(r.at)}`, link: `run.${r.id}`, adminOnly: true }); });
  CUSTOMERS.filter(c => c.status === 'onboarding' && diffDays(c.since, TODAY) > 14).forEach(c => items.push({ sev: 'att', icon: 'clock', label: `${c.name} has been onboarding for ${diffDays(c.since, TODAY)} days`, sub: `Started ${fmtDate(c.since)} · regiomanager invite not accepted yet`, link: `customer.${c.id}` }));
  return items.filter(i => !i.adminOnly || isAdmin());
}
const SCREENS = {};

/* ================= 5.2 Overview ================= */
SCREENS.overview = () => {
  const active = CUSTOMERS.filter(c => c.status === 'active');
  const billed = INVOICES.filter(i => i.ym === LAST_MONTH && i.kind === 'invoice').reduce((a, i) => a + i.lines.filter(l => l.kind !== 'adjustment').reduce((x, l) => x + l.qty, 0), 0);
  const recv = INVOICES.filter(i => ['issued', 'partially_paid', 'overdue'].includes(i.status));
  const recvSum = recv.reduce((a, i) => a + i.open, 0);
  const probs = DEPLOYMENTS.filter(d => ['down', 'slow'].includes(d.status));
  const items = attentionItems();
  const kpi = (href, t, chip, v, s) => `<a class="card kpi" href="#${href}"><div class="t"><span class="eyebrow">${t}</span>${chip}</div><div class="v">${v}</div><div class="s">${s}</div><span class="go">${ic('arrowr', 's')}</span></a>`;
  const html = `
  <div class="phead"><p class="lead" style="margin:0">Status of all ShelterSync customers on ${fmtDate(TODAY)}. Figures are aggregate counts only; no resident data is shown in this tool.</p>
    <div class="acts">${isAdmin() ? `<a class="btn pri" href="#customers.new">${ic('plus', 's')}New customer</a>` : ''}</div></div>
  <section class="kpis" aria-label="Key figures">
    ${kpi('customers', 'Active customers', `<span class="pill neu">${ic('circ', 'xs')}1 onboarding</span>`, active.length, `${CUSTOMERS.length} customers in total`)}
    ${kpi('usage', 'Residents billed last month', `<span class="pill neu">${ic('cal', 'xs')}${shortMonth(LAST_MONTH)} ${LAST_MONTH.slice(0, 4)}</span>`, `${fmtNum(billed, 2)}<small>gem. bewoners</small>`, `Sum over ${INVOICES.filter(i => i.ym === LAST_MONTH && i.kind === 'invoice').length} draft invoices`)}
    ${kpi('invoices', 'Open receivables', `<span class="pill err">${ic('xcirc', 'xs')}1 overdue</span>`, fmtMoney(recvSum), `${recv.length} invoices issued or partially paid`)}
    ${kpi('customers', 'Deployments with problems', `<span class="pill err">${ic('xcirc', 'xs')}1 down</span>`, probs.length, probs.map(d => `${cust(d.cid).name.replace('Stichting ', '')} ${d.env.toUpperCase()} ${d.status}`).join(' · '))}
  </section>
  <div class="split">
    <section class="card" aria-labelledby="att-h">
      <div class="ch"><h2 id="att-h">Needs attention</h2><span class="pill err">${ic('xcirc', 'xs')}${items.filter(i => i.sev === 'err').length} critical</span><span class="sub">Each item opens its source</span></div>
      ${S.demo === 'empty' || !items.length ? `<div class="empty"><div class="ei">${ic('check')}</div><b>Nothing needs attention</b><span>Invoices, deployments, usage and integrations are all in order.</span></div>` : `<ul class="att">${items.map(i => `<li><a href="#${i.link}"><span class="sv ${i.sev}">${ic(i.icon, 's')}</span><span><b>${esc(i.label)}</b><small>${esc(i.sub)}</small></span><span class="go">${ic('chevr', 's')}</span></a></li>`).join('')}</ul>`}
    </section>
    <section class="card" aria-labelledby="rpc-h">
      <div class="ch"><h2 id="rpc-h">Residents per customer, last 12 months</h2><span class="sub">Monthly gem. bewoners, ${shortMonth(MONTHS12[0])} ${MONTHS12[0].slice(0, 4)} – ${shortMonth(MONTHS12[11])} ${MONTHS12[11].slice(0, 4)}</span></div>
      <div class="sm-grid">${CUSTOMERS.map(c => smallMultiple(c)).join('')}</div>
      <div style="padding:0 18px 14px">${todo('Small multiples use an independent y-scale per customer so small customers stay readable. Confirm, or should all panels share one scale?')}</div>
    </section>
  </div>`;
  return { title: 'Overview', html };
};
function smallMultiple(c) {
  const vals = MONTHS12.map(ym => { const v = custMonthAvg(c.id, ym); return v > 0 ? v : null; });
  const have = vals.filter(v => v != null);
  if (!have.length) return `<div class="smc"><div class="hd"><b>${esc(c.name)}</b>${pill(c.status)}</div><p class="muted2" style="margin:18px 0;font-size:13px">No usage collected yet.</p></div>`;
  const W = 360, H = 84, pl = 30, pr = 8, pt = 8, pb = 18;
  let lo = Math.min(...have), hi = Math.max(...have); const padv = Math.max(4, (hi - lo) * 0.25); lo = Math.floor((lo - padv) / 5) * 5; hi = Math.ceil((hi + padv) / 5) * 5;
  const x = i => pl + i * (W - pl - pr) / 11, y = v => pt + (1 - (v - lo) / (hi - lo)) * (H - pt - pb);
  const pts = vals.map((v, i) => v == null ? null : [x(i), y(v)]).filter(Boolean);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = line + ` L${pts[pts.length - 1][0].toFixed(1)} ${H - pb} L${pts[0][0].toFixed(1)} ${H - pb} Z`;
  const lastI = vals.map((v, i) => v != null ? i : -1).filter(i => i >= 0).pop();
  const lastV = vals[lastI];
  return `<figure class="smc" style="margin:0"><div class="hd"><b>${esc(c.name)}</b><span class="num">${fmtNum(lastV, 0)}</span></div>
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.name)}: ${fmtNum(have[0], 0)} to ${fmtNum(lastV, 0)} residents">
    <line x1="${pl}" x2="${W - pr}" y1="${y(hi)}" y2="${y(hi)}" stroke="var(--lineS)"/><line x1="${pl}" x2="${W - pr}" y1="${y(lo)}" y2="${y(lo)}" stroke="var(--line)"/>
    <text class="ax" x="${pl - 5}" y="${y(hi) + 3}" text-anchor="end">${hi}</text><text class="ax" x="${pl - 5}" y="${y(lo) + 3}" text-anchor="end">${lo}</text>
    <path d="${area}" fill="var(--selT)"/><path d="${line}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${x(lastI)}" cy="${y(lastV)}" r="4" fill="var(--acc)" stroke="var(--ink)" stroke-width="1.5"/>
    <text class="ax" x="${pl}" y="${H - 3}">${shortMonth(MONTHS12[0])}</text><text class="ax" x="${W - pr}" y="${H - 3}" text-anchor="end">${shortMonth(MONTHS12[11])}</text>
  </svg>${c.status === 'offboarded' ? '<figcaption class="muted2" style="font-size:12px">Offboarded 30-04-2026</figcaption>' : ''}</figure>`;
}

/* ================= 5.3 Customers list ================= */
function custRow(c) {
  const deps = DEPLOYMENTS.filter(d => d.cid === c.id);
  const worst = deps.find(d => d.status === 'down') || deps.find(d => d.status === 'slow') || deps.find(d => d.env === 'prod') || deps[0];
  const open = INVOICES.filter(i => i.cid === c.id).reduce((a, i) => a + i.open, 0);
  const k = CONTRACTS.filter(x => x.cid === c.id).sort((a, b) => b.to.localeCompare(a.to))[0];
  const billed = custMonthAvg(c.id, LAST_MONTH);
  return `<tr class="click" data-href="customer.${c.id}" tabindex="0"><td class="nm"><a href="#customer.${c.id}">${esc(c.name)}</a></td><td><span class="mono">${c.slug}</span></td><td>${pill(c.status)}</td><td class="r">${locsOf(c.id).length}</td><td class="r">${c.status === 'offboarded' ? '—' : fmtNum(custActiveToday(c.id))}</td><td class="r">${billed ? fmtNum(billed, 2) : '—'}</td><td class="r">${open ? fmtMoney(open) : '—'}</td><td>${worst ? health(worst.status) + (deps.length > 1 ? ` <span class="muted2" style="font-size:12px">(${worst.env})</span>` : '') : '—'}</td><td class="num">${k ? fmtDate(k.to) : '<span class="muted2">No contract</span>'}</td></tr>`;
}

  const q = S.cust.q.toLowerCase();

  const cnt = st => CUSTOMERS.filter(c => st === 'all' || c.status === st).length;
  const toolbar = `<div class="toolbar">${seg([['all', 'All', cnt('all')], ['onboarding', 'Onboarding', cnt('onboarding')], ['active', 'Active', cnt('active')], ['suspended', 'Suspended', cnt('suspended')], ['offboarded', 'Offboarded', cnt('offboarded')]], S.cust.tab, 'custTab')}
  <div class="r"><div class="gsearch" style="width:260px">${ic('search', 's')}<label class="sr" for="cq">Search customers</label><input id="cq" class="inp" placeholder="Name or slug" value="${esc(S.cust.q)}" data-in="custQ"></div></div></div>`;
  return {
    title: 'Customers', html: `

      rows: list.map(custRow), empty: { icon: 'building', title: S.cust.q ? 'No customers match your search' : 'No customers with this status', text: S.cust.q ? 'Check the spelling or search by slug.' : 'Customers appear here when their status changes.', action: S.cust.q ? `<button class="btn quiet" data-act="clearCustQ">Clear search</button>` : isAdmin() ? `<a class="btn" href="#customers.new">${ic('plus', 's')}New customer</a>` : '' }
    })}`, after: () => { const i = $('#cq'); if (i && S.cust.focus) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); S.cust.focus = false; } }
  };
};
ACT.custTab = (_, k) => { S.cust.tab = k; render(); };
ACT.clearCustQ = () => { S.cust.q = ''; render(); };
IN.custQ = el => { S.cust.q = el.value; S.cust.focus = true; render(); };

/* ================= 5.4 Customer detail ================= */
SCREENS.customer = r => {
  const c = cust(r[1]); if (!c) return { title: 'Not found', html: `<div class="card empty"><b>Customer not found</b><a class="btn" href="#customers">Back to customers</a></div>` };
  const tabs = [['overview', 'Overview'], ['deployments', 'Deployments'], ['contracts', 'Contracts'], ['usage', 'Usage'], ['invoices', 'Invoices'], ['integrations', 'Integrations'], ['history', 'History']].filter(t => isAdmin() || t[0] !== 'integrations');
  const tab = tabs.find(t => t[0] === r[2]) ? r[2] : 'overview';
  const body = { overview: custOverview, deployments: custDeployments, contracts: custContracts, usage: c2 => usageView(c2.id), invoices: c2 => invoiceList(c2.id), integrations: c2 => integrationList(c2.id), history: c2 => auditView(c2.id) }[tab](c);
  return {
    title: c.name, html: `
    <nav class="crumb" aria-label="Breadcrumb"><a href="#customers">Customers</a>${ic('chevr', 'xs')}<span>${esc(c.name)}</span></nav>
    <div class="phead" style="margin-top:-6px"><div class="row" style="flex:1"><span class="mono muted">${c.slug}</span>${pill(c.status)}<span class="muted2">Customer since ${fmtDate(c.since)}</span></div></div>
    <div class="tabs" role="tablist" aria-label="Customer sections">${tabs.map(([k, l]) => `<button role="tab" aria-selected="${k === tab}" class="${k === tab ? 'on' : ''}" data-act="go" data-a="customer.${c.id}.${k}">${l}</button>`).join('')}</div>
    ${body}`, after: body.after
  };
};
function custOverview(c) {
  const lastInv = INVOICES.filter(i => i.cid === c.id && i.issue && i.kind === 'invoice').sort((a, b) => b.issue.localeCompare(a.issue))[0];
  const open = INVOICES.filter(i => i.cid === c.id).reduce((a, i) => a + i.open, 0);
  return `<section class="kpis">
    <div class="card kpi"><span class="eyebrow">Active residents today</span><div class="v">${c.status === 'offboarded' ? '—' : fmtNum(custActiveToday(c.id))}</div><div class="s">Collected 06-10-2026 04:10 for 05-10</div></div>
    <div class="card kpi"><span class="eyebrow">Locations</span><div class="v">${locsOf(c.id).length}</div><div class="s">${locsOf(c.id).reduce((a, l) => a + l.cap, 0)} places capacity</div></div>
    <a class="card kpi" ${lastInv ? `href="#invoice.${lastInv.id}"` : ''}><span class="eyebrow">Last invoice</span><div class="v" style="font-size:22px">${lastInv ? `<span class="mono" style="font-size:17px">${lastInv.number}</span>` : '—'}</div><div class="s">${lastInv ? `${fmtMonth(lastInv.ym)} · ${fmtMoney(lastInv.total)} · ${PILL[lastInv.status][2]}` : 'No invoice issued yet'}</div></a>

    <section class="card"><div class="ch"><h2>Organisation</h2>${isAdmin() ? `<div class="r"><button class="btn sm quiet" data-act="editOrg" data-a="${c.id}">${ic('edit', 's')}Edit</button></div>` : ''}</div>
      <div class="cb"><dl class="dl">
        <dt>Legal name</dt><dd>${esc(c.legal)}</dd><dt>Display name</dt><dd>${esc(c.name)}</dd>
        <dt>KvK</dt><dd class="mono">${c.kvk}</dd><dt>BTW-id</dt><dd class="mono">${c.btw}</dd>
        <dt>Billing address</dt><dd>${esc(c.addr)}</dd><dt>Invoice e-mail</dt><dd>${esc(c.email)}</dd>
        <dt>Contact person</dt><dd>${esc(c.contact)}</dd><dt>Notes</dt><dd>${esc(c.notes) || '<span class="muted2">—</span>'}</dd>
      </dl></div></section>
    <section class="card"><div class="ch"><h2>Status</h2></div><div class="cb stack">

      <p class="muted" style="margin:0;font-size:13px">Status changes are recorded in the audit log with the reason. Suspending a customer stops invoice generation; it does not switch off their deployment.</p>
      ${isAdmin() ? `<button class="btn" data-act="changeStatus" data-a="${c.id}">Change status…</button>` : ''}
      ${todo('Does “Suspended” also block the customer app, or only billing? Copy above assumes billing only.')}
    </div></section>
  </div>`;
}

};

/* ---- deployments tab ---- */
function custDeployments(c) {
  const deps = DEPLOYMENTS.filter(d => d.cid === c.id);
  if (!deps.length) return `<div class="card empty"><div class="ei">${ic('db')}</div><b>No deployment yet</b><span>Add the deployment after the ops runbook has created its database and app server.</span>${isAdmin() ? `<a class="btn" href="#customers.new">Open onboarding</a>` : ''}</div>`;
  const sel = S.dep[c.id] && deps.find(d => d.id === S.dep[c.id]) || deps[0];
  return `${deps.length > 1 ? `<div class="row">${seg(deps.map(d => [d.id, d.env.toUpperCase()]), sel.id, 'pickDep')}<span class="muted2" style="font-size:13px">Tenant settings, locations, invites and SSO below belong to the selected deployment.</span></div>` : ''}
  ${deps.map(d => depCard(d, d.id === sel.id)).join('')}
  ${depTenant(sel)}`;
}
ACT.pickDep = (el, id) => { const d = DEPLOYMENTS.find(x => x.id === id); S.dep[d.cid] = id; render(); };
function depCard(d, selected) {
  const okDays = d.strip.filter(s => s === 'ok').length, warn = d.strip.filter(s => s === 'warn').length, err = d.strip.filter(s => s === 'err').length;
  const lastLine = d.last.http >= 400 ? `<span class="pill err">${ic('xcirc', 'xs')}HTTP ${d.last.http}</span>` : `<span class="pill ok">${ic('check', 'xs')}HTTP ${d.last.http}</span>`;
  return `<section class="card" ${selected ? 'style="border-color:var(--line2)"' : ''} aria-label="${d.env} deployment">
  <div class="ch"><span class="tag ${d.env}">${d.env.toUpperCase()}</span><h2 style="font-size:16px"><a href="${d.url}" target="_blank" rel="noopener" style="text-decoration:none">${d.url.replace('https://', '')}</a></h2>${health(d.status)}
  ${isAdmin() && d.status !== 'decommissioned' ? `<div class="r"><button class="btn sm quiet" data-act="checkNow" data-a="${d.id}">${ic('refresh', 's')}Check now</button><button class="btn sm quiet" data-act="rotate" data-a="${d.id}">${ic('key', 's')}Rotate credential</button><button class="btn sm quiet" data-act="editDep" data-a="${d.id}">${ic('edit', 's')}Edit</button></div>` : ''}</div>

    <div class="row">${pillNL(i.kind === 'credit_note' ? 'credited' : i.status)}<span class="muted">${fmtMonthNL(i.ym)}</span></div>
    <dl class="dl"><dt>Factuurdatum</dt><dd>${fmtDate(i.issue)}</dd><dt>Vervaldatum</dt><dd>${fmtDate(i.due)}</dd><dt>Betaald</dt><dd class="num">${fmtMoney(i.paid)}</dd><dt>Openstaand</dt><dd class="num">${fmtMoney(i.open)}</dd></dl>
    <div class="tw"><table class="tbl"><thead><tr><th>Locatie</th><th class="r">Gem. bewoners</th><th class="r">Prijs per bewoner per maand</th><th class="r">Bedrag</th></tr></thead><tbody>${i.lines.map(l => `<tr><td>${l.kind === 'adjustment' ? esc(l.desc) : esc(l.loc)}</td><td class="r">${l.kind === 'adjustment' ? '—' : fmtNum(l.qty, 2)}</td><td class="r">${l.kind === 'adjustment' ? '—' : fmtMoney(l.unit)}</td><td class="r">${fmtMoney(l.amount)}</td></tr>`).join('')}</tbody></table></div>
    <div class="totals" style="width:100%"><span>Subtotaal</span><span>${fmtMoney(i.sub)}</span>${i.vatRows.map(v => `<span>Btw ${v.rate}%</span><span>${fmtMoney(v.vat)}</span>`).join('')}<span class="t">Totaal</span><span class="t">${fmtMoney(i.total)}</span></div>
    ${cn ? `<div class="banner info">${ic('credit')}<span class="bt"><b>Gecrediteerd</b>Deze factuur is gecrediteerd met <a class="mono" href="#facturen" data-act="cappOpen" data-a="${cn.id}">${cn.number}</a>.</span></div>` : ''}
    ${orig ? `<div class="banner info">${ic('credit')}<span class="bt"><b>Creditfactuur</b>Crediteert <a class="mono" href="#facturen" data-act="cappOpen" data-a="${orig.id}">${orig.number}</a>. Reden: ${esc(i.note)}</span></div>` : ''}`,
    foot: `<button class="btn quiet" data-act="closeLayer">Sluiten</button><button class="btn dark" data-act="cappPdf" data-a="${i.id}">${ic('download', 's')}Download PDF</button>`
  });
};

/* ================= boot ================= */
render();
</script>

</body></html>
